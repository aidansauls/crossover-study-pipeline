# =============================================================================
# example_data.yml
# Example/synthetic study configuration. Visual settings are inherited from
# config/visual_config.yml.
# =============================================================================

study:
  name: "example_data"
  intervention_label: "Intervention"
  control_label: "Control"
  form_x_label: "Form X"
  form_y_label: "Form Y"

columns:
  participant_id: "Participant_ID"
  intervention_order: "Intervention_Order"
  form_x_order: "X_Order"
  form_y_order: "Y_Order"
  time_taken: "Time_taken"

privacy:
  additional_direct_identifier_columns: []

item_exclusions:
  x: []
  y: []

scores:
  scale_to: 15

analysis:
  alpha: 0.05
  ci_level: 0.95
  min_n_carryover: 4
  ceiling_threshold: null
  floor_threshold: null

power_analysis:
  target_power: 0.80
  target_effects_pct: [5, 8, 10, 12, 15, 20]
  max_n: null

display_labels:
  condition_control: "Control"
  condition_ai: "Intervention"
  condition_control_short: "Control"
  condition_ai_short: "Intervention"
  condition_control_session: "Control study"
  condition_ai_session: "Intervention study"
  sequence_control_first: "Control first"
  sequence_ai_first: "Intervention first"

figures:
  y_axis_score_label: "Rescaled 0-15 score"
  x_axis_form_label: "Test Form"

flow_diagram:
  generate: true
  output_filename: "figure_s1_participant_flow.png"
  setup_label: "Participants (n = {n}) were randomized to sequence before the session\nand completed the common pre-period procedures before Block 1"
  control_sequence_label: "Control first"
  ai_sequence_label: "Intervention first"
  period1_control_label: "Control study"
  period1_ai_label: "Intervention study"
  control_short_label: "Control study"
  ai_short_label: "Intervention study"
  period2_control_label: "Control study"
  period2_ai_label: "Intervention study"

tables:
  export_csv: true
  export_png: true
  include_titles: false
  digits_default: 3
  digits_percent: 1

demographics:
  generate: false

sf36:
  generate: false

optional_analyses:
  run_time_analysis: true
  run_normality_tests: true
  run_restricted_comparison: false
  run_model_comparison: true
  run_ceiling_effects_figure: true
  run_period_specific_intervention: true
  run_subgroup4_contrasts: true
  run_post_hoc_power: true
  run_logistic_mixed_models: true

psychometrics:
  ability_strata: 4
  top_miss_threshold: 0.25
  bottom_hit_threshold: 0.60
  min_item_rest_r: 0.10
  max_item_missing_rate: 0.05
  max_participant_missing_rate: 0.20
