# =============================================================================
# study_config.yml
# Study meaning, input schema, scoring, analysis choices, and manuscript wording.
# Visual styling lives in config/visual_config.yml.
# =============================================================================

study:
  name: "my_study"
  intervention_label: "Intervention"
  control_label: "Control"
  form_x_label: "Form X"
  form_y_label: "Form Y"

# -----------------------------------------------------------------------------
# Input column mapping
# -----------------------------------------------------------------------------
columns:
  participant_id: "Participant_ID"
  intervention_order: "Intervention_Order"
  control_order: "Control_Order"
  form_x_order: "X_Order"
  form_y_order: "Y_Order"
  time_taken: "Time_taken"

# -----------------------------------------------------------------------------
# Privacy / deidentification
# The pipeline automatically recognizes obvious direct identifiers such as
# email, names, student IDs, MRNs, DOB, phone numbers, and addresses.
# Add study-specific identifier column names here if needed.
# participant_id is assumed to be a study code unless its configured column name
# is itself an obvious direct identifier (for example student_id).
# -----------------------------------------------------------------------------
privacy:
  additional_direct_identifier_columns: []

# -----------------------------------------------------------------------------
# Item exclusions
# -----------------------------------------------------------------------------
item_exclusions:
  x: []
  y: []

# -----------------------------------------------------------------------------
# Scoring
# -----------------------------------------------------------------------------
scores:
  scale_to: 10

# -----------------------------------------------------------------------------
# Analysis settings
# -----------------------------------------------------------------------------
analysis:
  alpha: 0.05
  ci_level: 0.95
  min_n_carryover: 4
  ceiling_threshold: null
  floor_threshold: null

# -----------------------------------------------------------------------------
# Post-hoc paired-test power/sample-size analysis
# -----------------------------------------------------------------------------
power_analysis:
  target_power: 0.80
  target_effects_pct: [5, 8, 10, 12, 15, 20]
  max_n: null

# -----------------------------------------------------------------------------
# Display-only labels. These do not change analysis coding.
# -----------------------------------------------------------------------------
display_labels:
  condition_control: "No-AI"
  condition_ai: "AI-assisted"
  condition_control_short: "No-AI"
  condition_ai_short: "AI-assisted"
  condition_control_session: "No-AI study"
  condition_ai_session: "AI-assisted study"
  sequence_control_first: "No-AI first"
  sequence_ai_first: "AI-assisted first"

# -----------------------------------------------------------------------------
# Study-specific figure wording only.
# Typography, colors, dimensions, spacing, and table layout are configured in
# config/visual_config.yml.
# -----------------------------------------------------------------------------
figures:
  y_axis_score_label: "Rescaled 0-10 score"
  x_axis_form_label: "Test Form"

# -----------------------------------------------------------------------------
# Figure S1 wording / behavior
# -----------------------------------------------------------------------------
flow_diagram:
  generate: true
  output_filename: "figure_s1_participant_flow.png"
  setup_label: "Participants (n = {n}) were randomized to sequence before the session\nand completed the lecture + AI guidance before Block 1"
  control_sequence_label: "No-AI first"
  ai_sequence_label: "AI-assisted first"
  period1_control_label: "No-AI study (20 min)"
  period1_ai_label: "AI-assisted study (20 min)"
  control_short_label: "No-AI study (20 min)"
  ai_short_label: "AI-assisted study (20 min)"
  period2_control_label: "No-AI study\n(20 min)"
  period2_ai_label: "AI-assisted study\n(20 min)"

# -----------------------------------------------------------------------------
# Table data/export settings
# -----------------------------------------------------------------------------
tables:
  export_csv: true
  export_png: true
  include_titles: false
  digits_default: 3
  digits_percent: 1

# -----------------------------------------------------------------------------
# Optional demographics module
# -----------------------------------------------------------------------------
demographics:
  generate: false
  file: "demographics.csv"
  columns:
    participant: "participant"
    age: "age"
    gender: "gender"
    training_level: "training_level"

sf36:
  generate: false
  file: "sf36_scores.csv"

# -----------------------------------------------------------------------------
# Optional analyses
# -----------------------------------------------------------------------------
optional_analyses:
  run_time_analysis: true
  run_normality_tests: true
  run_restricted_comparison: true
  run_model_comparison: true
  run_ceiling_effects_figure: true
  run_period_specific_intervention: true
  run_subgroup4_contrasts: true
  run_post_hoc_power: true
  run_logistic_mixed_models: true

# -----------------------------------------------------------------------------
# Psychometrics
# -----------------------------------------------------------------------------
psychometrics:
  ability_strata: 3
  top_miss_threshold: 0.25
  bottom_hit_threshold: 0.60
  min_item_rest_r: 0.10
  max_item_missing_rate: 0.05
  max_participant_missing_rate: 0.20

# =============================================================================
# Comparison runs are configured separately in config/comparison_*.yml and are
# not part of the normal manuscript_selected / extra output tree.
# =============================================================================
